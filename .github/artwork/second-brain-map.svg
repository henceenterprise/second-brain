<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">Six areas in Second Brain</title><desc id="desc">Inbox captures; Personal keeps life records; Work holds projects and roles; Resources holds reusable learning; Planner organizes actions and reviews; System holds layouts and tags. This is a directory overview, not a graph of links.</desc><g font-family="Arial, Helvetica, sans-serif"><g><rect x="1" y="1" width="518" height="222" rx="12" fill="#f59e0b" fill-opacity=".045" stroke="#f59e0b" stroke-opacity=".4"/><polygon points="59.00,48.00 52.50,59.26 39.50,59.26 33.00,48.00 39.50,36.74 52.50,36.74" fill="none" stroke="#f59e0b" stroke-width="3"/><text x="78" y="57" fill="#505a68" font-size="18" letter-spacing="2">01</text><text x="32" y="121" fill="#171b22" font-size="37" font-weight="700">Inbox</text><text x="32" y="166" fill="#505a68" font-size="22">Capture first. Decide later.</text></g><g><rect x="541" y="1" width="518" height="222" rx="12" fill="#ef7daa" fill-opacity=".045" stroke="#ef7daa" stroke-opacity=".4"/><polygon points="599.00,48.00 592.50,59.26 579.50,59.26 573.00,48.00 579.50,36.74 592.50,36.74" fill="none" stroke="#ef7daa" stroke-width="3"/><text x="618" y="57" fill="#505a68" font-size="18" letter-spacing="2">02</text><text x="572" y="121" fill="#171b22" font-size="37" font-weight="700">Personal</text><text x="572" y="166" fill="#505a68" font-size="22">Records of your own life.</text></g><g><rect x="1081" y="1" width="518" height="222" rx="12" fill="#60a5fa" fill-opacity=".045" stroke="#60a5fa" stroke-opacity=".4"/><polygon points="1139.00,48.00 1132.50,59.26 1119.50,59.26 1113.00,48.00 1119.50,36.74 1132.50,36.74" fill="none" stroke="#60a5fa" stroke-width="3"/><text x="1158" y="57" fill="#505a68" font-size="18" letter-spacing="2">03</text><text x="1112" y="121" fill="#171b22" font-size="37" font-weight="700">Work</text><text x="1112" y="166" fill="#505a68" font-size="22">Projects, roles and responsibilities.</text></g><g><rect x="1" y="251" width="518" height="222" rx="12" fill="#34d399" fill-opacity=".045" stroke="#34d399" stroke-opacity=".4"/><polygon points="59.00,298.00 52.50,309.26 39.50,309.26 33.00,298.00 39.50,286.74 52.50,286.74" fill="none" stroke="#34d399" stroke-width="3"/><text x="78" y="307" fill="#505a68" font-size="18" letter-spacing="2">04</text><text x="32" y="371" fill="#171b22" font-size="37" font-weight="700">Resources</text><text x="32" y="416" fill="#505a68" font-size="22">Learning and knowledge to reuse.</text></g><g><rect x="541" y="251" width="518" height="222" rx="12" fill="#a78bfa" fill-opacity=".045" stroke="#a78bfa" stroke-opacity=".4"/><polygon points="599.00,298.00 592.50,309.26 579.50,309.26 573.00,298.00 579.50,286.74 592.50,286.74" fill="none" stroke="#a78bfa" stroke-width="3"/><text x="618" y="307" fill="#505a68" font-size="18" letter-spacing="2">05</text><text x="572" y="371" fill="#171b22" font-size="37" font-weight="700">Planner</text><text x="572" y="416" fill="#505a68" font-size="22">Actions, events and reviews.</text></g><g><rect x="1081" y="251" width="518" height="222" rx="12" fill="#94a3b8" fill-opacity=".045" stroke="#94a3b8" stroke-opacity=".4"/><polygon points="1139.00,298.00 1132.50,309.26 1119.50,309.26 1113.00,298.00 1119.50,286.74 1132.50,286.74" fill="none" stroke="#94a3b8" stroke-width="3"/><text x="1158" y="307" fill="#505a68" font-size="18" letter-spacing="2">06</text><text x="1112" y="371" fill="#171b22" font-size="37" font-weight="700">System</text><text x="1112" y="416" fill="#505a68" font-size="22">Layouts and topic guidance.</text></g></g></svg>
